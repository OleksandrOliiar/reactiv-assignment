services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: reactiv
      POSTGRES_PASSWORD: reactiv
      POSTGRES_DB: reactiv
    ports:
      - '55432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U reactiv -d reactiv']
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      PORT: 3001
      DATABASE_URL: postgres://reactiv:reactiv@postgres:5432/reactiv
      API_KEY: ${API_KEY:-change-me-to-a-long-random-secret}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      NODE_ENV: production
      DEFAULT_CONFIG_ID: ${DEFAULT_CONFIG_ID:-default}
    ports:
      - '3001:3001'
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3001/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      CONFIG_SERVICE_URL: http://api:3001
      CONFIG_SERVICE_API_KEY: ${CONFIG_SERVICE_API_KEY:-change-me-to-a-long-random-secret}
      DEFAULT_CONFIG_ID: ${DEFAULT_CONFIG_ID:-default}
    ports:
      - '3000:3000'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  postgres-data:
